<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200">
  <title>น้องส้ม — กำลังคิด</title>
  <!-- ท่า思考: นั่งเท้าคาง หางส่ายช้า ๆ มีจุดคิดลอย -->
  <style>
    .breathe { animation: breathe 3.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2px) } }
    .idea { animation: idea 1.6s ease-in-out infinite; }
    .idea2 { animation-delay: .3s } .idea3 { animation-delay: .6s }
    @keyframes idea { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
  </style>

  <!-- เงา -->
  <ellipse cx="110" cy="188" rx="64" ry="9" fill="#000" opacity=".08"/>

  <g class="breathe">
    <!-- หาง (ส่ายช้า ๆ) -->
    <g>
      <path d="M158 164 C196 170 210 134 192 110" fill="none" stroke="#FFA94D" stroke-width="16" stroke-linecap="round"/>
      <path d="M201 124 C205 118 205 113 203 108" fill="none" stroke="#F08A3C" stroke-width="15" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-7 158 164; 8 158 164; -7 158 164" dur="2.8s" repeatCount="indefinite"/>
    </g>

    <!-- ตัวกลมอ้วน -->
    <ellipse cx="110" cy="142" rx="58" ry="46" fill="#FFA94D"/>
    <ellipse cx="110" cy="152" rx="36" ry="32" fill="#FFE9CF"/>
    <!-- ลายเสือข้างลำตัว -->
    <path d="M58 126 q13 7 13 19" stroke="#F08A3C" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M162 126 q-13 7 -13 19" stroke="#F08A3C" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- เท้าหน้า -->
    <ellipse cx="88" cy="180" rx="17" ry="10" fill="#FFE9CF"/>
    <ellipse cx="132" cy="180" rx="17" ry="10" fill="#FFE9CF"/>

    <!-- หู -->
    <path d="M66 54 L70 14 L106 44 Z" fill="#FFA94D"/>
    <path d="M77 50 L80 28 L97 45 Z" fill="#FFC9C9"/>
    <path d="M154 54 L150 14 L114 44 Z" fill="#FFA94D"/>
    <path d="M143 50 L140 28 L123 45 Z" fill="#FFC9C9"/>

    <!-- หัว + แก้มป่อง -->
    <circle cx="110" cy="90" r="52" fill="#FFA94D"/>
    <circle cx="66" cy="106" r="21" fill="#FFA94D"/>
    <circle cx="154" cy="106" r="21" fill="#FFA94D"/>
    <!-- ลายหน้าผาก -->
    <path d="M101 56 V67 M110 54 V66 M119 56 V67" stroke="#F08A3C" stroke-width="6" stroke-linecap="round"/>

    <!-- ตาโตมองขึ้นข้างบน -->
    <ellipse cx="90" cy="87" rx="13" ry="14" fill="#fff"/>
    <ellipse cx="130" cy="87" rx="13" ry="14" fill="#fff"/>
    <circle cx="93" cy="82" r="9" fill="#3B2B26"/>
    <circle cx="133" cy="82" r="9" fill="#3B2B26"/>
    <circle cx="96.5" cy="78" r="3.4" fill="#fff"/>
    <circle cx="136.5" cy="78" r="3.4" fill="#fff"/>

    <!-- ปากมุมจิ้ม + แก้มสีชมพู -->
    <ellipse cx="110" cy="117" rx="22" ry="13" fill="#FFE9CF"/>
    <path d="M104 110 h12 l-6 6.5 z" fill="#EF6E6E" stroke="#EF6E6E" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M110 117 q-5 7 -11 2 M110 117 q5 7 11 2" stroke="#D2813F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="64" cy="114" rx="11" ry="7" fill="#FF9BB0" opacity=".55"/>
    <ellipse cx="156" cy="114" rx="11" ry="7" fill="#FF9BB0" opacity=".55"/>

    <!-- หนวด -->
    <path d="M54 110 L34 105 M54 118 L32 119 M54 126 L34 132" stroke="#E8A77A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M166 110 L186 105 M166 118 L188 119 M166 126 L186 132" stroke="#E8A77A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- เท้าง้างจับใต้คาง -->
    <g transform="rotate(-16 92 138)">
      <ellipse cx="92" cy="138" rx="15" ry="12" fill="#FFA94D"/>
      <path d="M85 142 h14 M89 136 v2 M95 136 v2" stroke="#F08A3C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- จุดคิดลอย -->
  <circle class="idea" cx="170" cy="54" r="4.5" fill="#FFC46B"/>
  <circle class="idea idea2" cx="183" cy="37" r="6" fill="#FFB057"/>
  <circle class="idea idea3" cx="198" cy="16" r="7.5" fill="#FF9F45"/>
</svg>
