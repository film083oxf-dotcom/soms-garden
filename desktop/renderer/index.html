<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>น้องส้ม · desktop pet</title>
<!-- จำกัดแหล่งที่มาตามที่ Electron แนะนำ: โหลดเฉพาะไฟล์ในโปรเจกต์ -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:; connect-src 'none'">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;              /* หน้าต่างโปร่งใส */
    font-family: "Noto Sans Thai", "Leelawadee UI", "Th Sarabun New", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* .rig = คู่ฟองคำพูด + ตัวน้องส้ม — เลื่อนแนวนอนไปด้วยกันตอนเดิน */
  #rig {
    position: absolute;
    left: 0;
    bottom: 8px;
    width: 170px;
    height: 150px;
    pointer-events: none;                 /* เฉพาะตัวน้องกับฟองเท่านั้นที่รับคลิก */
  }
  #pet {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 170px;
    height: 150px;
    cursor: pointer;
    pointer-events: auto;
    transform-origin: 50% 100%;           /* พลิกซ้าย-ขวาโดยไม่ให้ลอย */
  }
  #sprite {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-user-drag: none;
    transform-origin: 50% 100%;
  }

  /* เดิน: ตัวเด้ง + เอียงตามจังหวะก้าว — ทำด้วย CSS ล้วน ไม่มีสไปรต์เฟรมใหม่ */
  #rig.walking #sprite { animation: waddle .6s ease-in-out infinite; }
  @keyframes waddle {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50%      { transform: rotate(3deg) translateY(-6px); }
  }

  /* success: กระโดดหนึ่งครั้ง (เล่นรอบเดียว) */
  #rig.hop #sprite { animation: hop .8s ease-out 1; }
  @keyframes hop {
    0%   { transform: translateY(0) scale(1, 1); }
    22%  { transform: translateY(-40px) scale(.96, 1.05); }
    46%  { transform: translateY(0) scale(1.08, .92); }
    62%  { transform: translateY(-8px) scale(1, 1); }
    100% { transform: translateY(0) scale(1, 1); }
  }

  /* ฟองคำพูดลอยเหนือหัว — เลื่อนตามตัวน้อง แต่ไม่พลิกตอนเดินกลับด้าน */
  #bubble {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    max-width: 260px;
    min-width: 44px;
    padding: 7px 11px;
    border-radius: 13px;
    background: #FFFFFF;
    color: #5B4636;
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
    white-space: pre-wrap;
    box-shadow: 0 4px 14px rgba(90, 60, 30, .18);
    pointer-events: auto;
    opacity: 0;
    transition: opacity .2s ease;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: "";
    position: absolute;
    bottom: -7px;
    left: 50%;
    margin-left: -7px;
    border: 7px solid transparent;
    border-top-color: #FFFFFF;
    border-bottom: 0;
  }

  /* โหมด "น้องแมวง่วงนอน" — CSS sprite sheet 2×2 (4 เฟรม · เฟรมละ 1.5s = 6s/รอบ)
     ภาพนี้เป็นงานวาดขอบเนียน (~142k สี) ไม่ใช่พิกเซลฮาร์ดเอดจ์ จึงไม่ใช้ image-rendering: pixelated
     ค่า background-size/position ของแต่ละเฟรมคำนวณจาก bounding box ของแมวในเฟรมนั้น
     ให้ความสูง ขอบล่าง และจุดกึ่งกลางตรงกับ sprites/idle.png ตอนแสดงในกล่อง 170×150 */
  #sleepSprite {
    display: none;
    position: absolute;
    left: 0;
    bottom: 0;
    width: 170px;
    height: 150px;
    background-image: url("../../assets/soms-garden-fat-lazy-cat-sleepy-spritesheet.png");
    background-repeat: no-repeat;
    /* เฟรม 1 (บนซ้าย) — ค่าเดียวกับ 0% ด้านล่าง ใช้ตอน prefers-reduced-motion */
    background-size: 300.06px 300.06px;
    background-position: 6.31px -8.27px;
    /* ตัดเฉพาะพื้นที่เฟรมตัวเอง ไม่ให้เฟรมข้างเคียงโผล่ในกล่อง 170px */
    clip-path: inset(0px 13.66px 8.24px 6.31px);
  }
  #rig.sleepy #sleepSprite {
    display: block;
    animation: sleepyAnim 6s steps(1, end) infinite;
  }
  #rig.sleepy #sprite {
    display: none;
  }
  /* 4 เฟรม เฟรมละ 1.5s · steps(1, end) = ค้างท่านั้นไว้แล้วตัดไปเฟรมถัดไป */
  @keyframes sleepyAnim {
    0%  {
      background-size: 300.06px 300.06px; background-position: 6.31px -8.27px;
      clip-path: inset(0px 13.66px 8.24px 6.31px);
    }                                                                                       /* นอนขด */
    25% {
      background-size: 288.07px 288.07px; background-position: -129.28px -11.16px;
      clip-path: inset(0px 11.21px 17.12px 14.75px);
    }                                                                                       /* หาว */
    50% {
      background-size: 303.21px 303.21px; background-position: 6.58px -150.07px;
      clip-path: inset(1.53px 11.82px 0px 6.58px);
    }                                                                                       /* กลิ้ง */
    75% {
      background-size: 301.85px 301.85px; background-position: -144.46px -152.45px;
      clip-path: inset(0px 12.61px 0.6px 6.46px);
    }                                                                                       /* นอนหงาย */
  }

  /* เคารพ prefers-reduced-motion — หยุดทุกอนิเมชัน น้องส้มยืนนิ่ง (ไม่เดิน) */
  @media (prefers-reduced-motion: reduce) {
    #sprite { animation: none !important; }
    #bubble { transition: none; }
    #rig.sleepy #sleepSprite {
      animation: none !important;
      /* เฟรมแรก (นอนขด) — ต้องตรงกับค่า 0% ของ sleepyAnim */
      background-size: 300.06px 300.06px;
      background-position: 6.31px -8.27px;
      clip-path: inset(0px 13.66px 8.24px 6.31px);
    }
  }
</style>
</head>
<body>
  <div id="rig">
    <div id="bubble" role="status" aria-live="polite"><span id="bubbleText"></span></div>
    <div id="pet" title="คลิก = ไปหน้าต่างเอเจนต์ · คลิกขวา = เมนู">
      <img id="sprite" src="../../sprites/idle.png" alt="น้องส้ม แมวส้มอ้วน" draggable="false">
      <div id="sleepSprite" aria-hidden="true"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
